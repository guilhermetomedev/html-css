<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: antiquewhite;
        }

        div.container {
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            grid-auto-rows: 100px;
            grid-auto-columns: 1fr;
            width: 100vw;
            height: 100vh;
        }

        div.items1 {
            grid-row: 1 / -3;
            grid-column: 1 / -4;
            background-color: lightcoral;
        }

        div.items2 {
            grid-row: 1 / -3;
            grid-column: 2 / -2;
            background-color: lightseagreen;
        }

        div.items3 {
            grid-row: 1 /-1;
            grid-column: 4 /-1;
            background-color: lightsalmon;
        }

        div.items4 {
            grid-row: 2 / -1;
            grid-column: 1 / -4;
            background-color: lightgoldenrodyellow;
        }

        div.items5 {
            grid-row: 2 / -1;
            grid-column: 2 / -3;
            background-color: lightpink;
        }

        div.items6 {
            grid-row: 2 / -1;
            grid-column: 3 / -2;
            background-color: lightslategrey;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items1">A</div>
        <div class="items2">B</div>
        <div class="items3">C</div>
        <div class="items4">D</div>
        <div class="items5">E</div>
        <div class="items6">F</div>
    </div>
</body>
</html>
