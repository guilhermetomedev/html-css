<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox inicial</title>
    <style>
        div.container {
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-around;
            align-items: center;
            height: 150px;
            flex-direction: row;
        }
        div.items {
            background-color: orange;
            border: 1px solid black;
            padding: 5px;
            height: 50px;
            color: black;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">Exemplo de bloco A</div>
        <div class="items">Exemplo de bloco B</div>
        <div class="items">Exemplo de bloco C</div>
        <div class="items">Exemplo de bloco D</div>
        <div class="items">Exemplo de bloco E</div>
    </div>
</body>
</html>
