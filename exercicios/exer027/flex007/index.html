<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox inicial</title>
    <style>
        div.container {
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;
            height: 50px;
            align-items: center;
        }
        div.items {
            background-color: orange;
            border: 1px solid black;
            color: black;
            text-align: center;
            flex-basis: 100px;
        }

        div#cx1 {
            flex-shrink: 2;
            flex-grow: 1;
        }
        div#cx2 {
            flex-shrink: 1;
            flex-grow: 2;
        }
        div#cx3 {
            flex-shrink: 2;
            flex-grow: 0;
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="items" id="cx1">A</div>
        <div class="items" id="cx2">B</div>
        <div class="items" id="cx3">C</div>
    </div>
</body>
</html>
