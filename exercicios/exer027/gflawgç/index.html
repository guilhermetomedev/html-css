<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            list-style-type: none;
            text-decoration: none;
            color: white;
        }

        body, html {
             background-color: black;
             height: 100vh;
             max-width: 100vw;
        }

        header {
            position: sticky;
            top: 0;
            background-color: rgb(43, 106, 223);
            height: 50px;
        }

        div.logo {
            background-color: rgba(255, 253, 127, 0.514);
            font: normal bold 2em arial;
            margin: 0 1.5rem;
            width: 100px;
            height: 50%;
        }

        nav.menu {
            background-color: rgba(255, 0, 0, 0.281);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-flow: row wrap;
            height: 100%;
            
            
        }

        nav.menu > ul {
            display: flex;
            gap: 20px;
            margin-right: 1rem;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        
        <nav class="menu">
            <ul>
                <li><a href="">Home</a></li>
                <li>Sobre</li>
                <li>Conteudo</li>
                <li>Contato</li>
            </ul>
        </nav>
    </header>
</body>
</html>
