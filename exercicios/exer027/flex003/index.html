<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox inicial</title>
    <style>
        div.container {
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-evenly;
            align-items: center;
        }
        div.items {
            background-color: orange;
            border: 1px solid black;
            color: black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">Exemplo de texto A</div>
        <div class="items">Exemplo de texto B</div>
        <div class="items">Exemplo de texto C</div>
        <div class="items">Exemplo de texto D</div>
        <div class="items">Exemplo de texto E</div>
    </div>
</body>
</html>
